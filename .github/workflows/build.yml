name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Find project folder
        id: p
        run: |
          F=$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)
          if [ -z "$F" ]; then echo "Không thấy settings.gradle.kts"; ls -R | head -50; exit 1; fi
          echo "dir=$(dirname "$F")" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: ${{ steps.p.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Threads2Video-APK
          path: ${{ steps.p.outputs.dir }}/app/build/outputs/apk/debug/*.apk
